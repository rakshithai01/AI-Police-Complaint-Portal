<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Police Complaint Portal (demo)</title><meta name="application-name" content="AI Police Complaint Portal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Design system: navy #102A43, teal #2EC4B6, bg #F5F9FC, cards #FFF, alert #FDECEC, border #D9E2EC.
     --teal is for fills/borders; --teal-d is the darker teal used for teal TEXT/icons (passes contrast on white). */
  --bg:#F5F9FC; --surface:#FFFFFF; --surface2:#F5F9FC; --ink:#102A43; --muted:#486581; --line:#D9E2EC;
  --navy:#102A43; --navy2:#1D3F5E; --on-navy:#FFFFFF; --teal:#2EC4B6; --teal-d:#0E7C86; --teal-soft:#E3F7F5;
  --accent:#102A43; --accent-ink:#FFFFFF; --saffron:#E0A100; --saffron-soft:#FFF6DC;
  --danger:#B42318; --danger-soft:#FDECEC; --ok:#1E7B3A; --ok-soft:#E1F4E7; --focus:#1B6FD1;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 6px 18px rgba(16,42,67,.07); --shadow2:0 2px 4px rgba(16,42,67,.08),0 12px 30px rgba(16,42,67,.12);
  --c1:#6B84A6; --c2:#3E7CB1; --c3:#2EC4B6; --c4:#1E7B3A; --c5:#E0A100; --c6:#7A8CA5;
  --danger-ink:#7A1A12; --danger-line:#F3C4C0;
  --r:14px; --pad:clamp(14px,3vw,28px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121F; --surface:#10213A; --surface2:#0D1B30; --ink:#E7EEF7; --muted:#A1B2C7; --line:#274161;
    --navy:#06101D; --navy2:#0C2342; --teal:#3CC4C0; --teal-d:#3CC4C0; --teal-soft:#10383D; --accent:#3CC4C0; --accent-ink:#04201F;
    --saffron:#F2B53A; --saffron-soft:#3A2E10; --danger:#F29A93; --danger-soft:#40201D; --ok:#7BD695; --ok-soft:#15351F; --focus:#7DB4FF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --shadow2:0 2px 4px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.5);
    --c1:#7F98BA; --c2:#5B9AD1; --c3:#3CC4C0; --c4:#7BD695; --c5:#F2B53A; --c6:#8DA0BA;
  }
}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#10213A; --surface2:#0D1B30; --ink:#E7EEF7; --muted:#A1B2C7; --line:#274161;
  --navy:#06101D; --navy2:#0C2342; --teal:#3CC4C0; --teal-d:#3CC4C0; --teal-soft:#10383D; --accent:#3CC4C0; --accent-ink:#04201F;
  --saffron:#F2B53A; --saffron-soft:#3A2E10; --danger:#F29A93; --danger-soft:#40201D; --ok:#7BD695; --ok-soft:#15351F; --focus:#7DB4FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --shadow2:0 2px 4px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.5);
  --c1:#7F98BA; --c2:#5B9AD1; --c3:#3CC4C0; --c4:#7BD695; --c5:#F2B53A; --c6:#8DA0BA;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:90px;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Anek Telugu","Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden;max-width:100vw}
#app{display:flex;flex-direction:column;flex:1;min-width:0}
main{flex:1;min-width:0}
:lang(te){font-family:"Anek Telugu","Noto Sans Telugu","Plus Jakarta Sans",system-ui,sans-serif;line-height:1.7}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
h1{font-size:clamp(1.4rem,3.4vw,2rem)} h2{font-size:clamp(1.2rem,2.6vw,1.5rem)} h3{font-size:1.05rem}
p{margin:0 0 .9em}
img,svg,video{max-width:100%}
.muted{color:var(--muted)} .small{font-size:.9rem}
.wrap{max-width:1200px;margin:0 auto;width:100%;min-width:0;padding-left:max(var(--pad),env(safe-area-inset-left,0px));padding-right:max(var(--pad),env(safe-area-inset-right,0px))}
.ic{flex:none;vertical-align:-.2em}
/* header: one row at every width. brand | nav (desktop) | language | menu */
header.top{position:sticky;top:0;z-index:30;background:var(--surface);color:var(--ink);border-bottom:3px solid var(--teal);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;background:none;border:0;padding:0;cursor:pointer;font:inherit;text-align:start;min-width:0;flex:0 1 auto}
.brand .mark{width:40px;height:40px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:var(--teal);flex:none}
.brand span.t{min-width:0;display:block}
.brand b{display:block;font-size:1.05rem;line-height:1.15;white-space:nowrap}
.brand small{display:block;font-size:.74rem;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1 1 0;min-width:0}
.nav{display:none;gap:2px;flex:none}
.nav button{background:none;border:0;color:inherit;font:inherit;font-size:.93rem;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--teal-soft)}
.only-m{display:flex}
@media(min-width:1000px){.nav{display:flex}.menu .pop .only-m{display:none}}
/* language picker: one compact native select (all languages), never crowds the title */
.langsel{position:relative;display:flex;align-items:center;flex:none;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:42px;max-width:150px}
.langsel:hover,.langsel:focus-within{border-color:var(--teal)}
.langsel .ic{position:absolute;inset-inline-start:9px;pointer-events:none;color:var(--teal-d)}
.langsel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;box-shadow:none;min-height:40px;width:100%;padding:6px 26px 6px 32px;font-size:.9rem;font-weight:600;border-radius:10px;text-overflow:ellipsis;cursor:pointer}
html[dir=rtl] .langsel select{padding:6px 32px 6px 26px}
.langsel::after{content:"";position:absolute;inset-inline-end:11px;top:50%;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.menu{position:relative;flex:none}
.menu>button{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:10px;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.menu>button:hover{background:var(--teal-soft);border-color:var(--teal)}
.menu .pop{position:absolute;inset-inline-end:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 2*var(--pad)));max-height:calc(100dvh - 120px);overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow2);padding:6px;display:none;transform-origin:top right}
.menu .pop.open{display:block;animation:pop .16s ease-out}
.menu .pop button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;color:inherit;font:inherit;padding:12px;min-height:46px;border-radius:10px;cursor:pointer}
.menu .pop button:hover{background:var(--teal-soft)}
.menu .pop .sep{height:1px;background:var(--line);margin:4px 6px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.strip{font-size:.88rem;padding:8px 0;line-height:1.45}
.strip .wrap{display:flex;gap:10px;align-items:flex-start}
.strip .wrap>div{min-width:0;overflow-wrap:anywhere}
.strip.emerg{background:var(--danger-soft);color:var(--danger-ink);border-bottom:1px solid var(--danger-line)}
.strip.demo{background:var(--teal-soft);color:var(--ink);border-bottom:1px solid var(--line)}
/* layout */
main{padding:24px 0 48px}
#view.enter{animation:pg .38s cubic-bezier(.2,.7,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,3vw,22px);box-shadow:var(--shadow);min-width:0}
.stack>*+*{margin-top:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 22px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;max-width:100%}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,42,67,.22);border-color:var(--teal)}
.btn:active{transform:none}
.btn{text-align:center;line-height:1.3;overflow-wrap:anywhere}
.btn.sec{background:transparent;color:var(--accent)}
.btn.light{background:var(--teal);border-color:var(--teal);color:var(--navy)}
.btn.light:hover{background:#fff;border-color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:38px;padding:4px 14px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.field{display:block;margin-bottom:16px}
.field>span.l{display:block;font-weight:600;margin-bottom:5px;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;min-height:48px;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--teal)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger)}
textarea{min-height:150px;resize:vertical}
.hint{font-size:.86rem;color:var(--muted);margin-top:4px}
.ferr{font-size:.86rem;color:var(--danger);margin-top:4px;display:flex;gap:6px;align-items:center}
.err{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);border-radius:12px;padding:10px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.note{background:var(--saffron-soft);border-left:5px solid var(--saffron);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.okbox{background:var(--ok-soft);border-left:5px solid var(--ok);border-radius:8px;padding:10px 14px;margin:0 0 14px}
.tealbox{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:.93rem}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--saffron-soft);border:1px solid var(--saffron);color:var(--ink);white-space:nowrap}
.tag.ok{background:var(--ok-soft);border-color:var(--ok)} .tag.no{background:var(--danger-soft);border-color:var(--danger)} .tag.teal{background:var(--teal-soft);border-color:var(--teal)}
/* hero */
.hero{background:radial-gradient(800px 380px at 90% -10%,rgba(46,196,182,.30),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:20px;padding:clamp(18px,4vw,44px);box-shadow:var(--shadow2);display:grid;gap:clamp(18px,3vw,28px);grid-template-columns:minmax(0,1fr);overflow:hidden;position:relative}
.hero>*{min-width:0}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:center}}
.hero h1{color:#fff;margin-bottom:.4em;font-size:clamp(1.5rem,4.4vw,2.3rem)}
.hero p.lead{font-size:clamp(.95rem,2.4vw,1.05rem);opacity:.94;max-width:56ch}
.hero .chip{display:inline-flex;gap:8px;align-items:center;max-width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 13px;font-size:.82rem;margin-bottom:14px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
.hero .emergcard{margin-top:20px;background:var(--danger-soft);color:var(--danger-ink);border:1px solid var(--danger-line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:.9rem;overflow-wrap:anywhere}
.hero .emergcard>div{min-width:0}
.preview{background:rgba(255,255,255,.96);color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
:root[data-theme="dark"] .preview{background:#10213A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .preview{background:#10213A}}
.preview .pid{font-weight:800;letter-spacing:.05em;font-size:1.15rem;word-break:break-all}
.prow{display:flex;gap:12px;align-items:center;padding:9px 0;opacity:.45;animation:lit .5s forwards;animation-delay:var(--d,0s)}
.prow .dot{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
@keyframes lit{to{opacity:1}}
.prow.on .dot{background:var(--teal);border-color:var(--teal)}
.prow .bar{height:6px;border-radius:99px;background:var(--line);flex:1;overflow:hidden}
.prow .bar i{display:block;height:100%;width:0;background:var(--teal);animation:fill 1.2s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes fill{to{width:100%}}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ico{width:46px;height:46px;border-radius:14px;background:var(--teal-soft);color:var(--teal-d);display:grid;place-items:center;flex:none}
.hoverlift{transition:transform .2s,box-shadow .2s,border-color .2s}
.hoverlift:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:var(--teal)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.scard{position:relative;padding:20px}
.scard .n{position:absolute;top:14px;right:16px;font-weight:800;font-size:2rem;color:var(--teal-soft);-webkit-text-stroke:1px var(--teal)}
.scard .ico{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;margin-bottom:12px}
/* wizard */
.pbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#2A6FDB);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s}
.stp+.stp{margin-top:12px}
.stp.open{border-color:var(--teal)}
.stp>button.hd{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:16px 18px;cursor:pointer;min-height:68px}
.stp>button.hd[disabled]{cursor:not-allowed;opacity:.62}
.stp .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;border:2px solid var(--line);color:var(--muted);transition:background .3s,color .3s,border-color .3s}
.stp.done .num{background:var(--teal);border-color:var(--teal);color:#fff}
.stp.cur .num{border-color:var(--saffron);color:var(--ink);box-shadow:0 0 0 4px var(--saffron-soft)}
.stp .ttl{flex:1;min-width:0}
.stp .ttl b{display:block}
.stp .ttl small{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp .chev{transition:transform .25s;color:var(--muted)}
.stp.open .chev{transform:rotate(180deg)}
.stp .panel{padding:4px 18px 22px;animation:pg .3s ease}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.cats button{min-height:60px;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:inherit;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:center;transition:border-color .15s,transform .15s,background .15s}
.cats button:hover{border-color:var(--teal);transform:translateY(-2px)}
.cats button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);font-weight:700}
.petition{white-space:pre-wrap;overflow-wrap:anywhere}
.bns{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface2);flex-wrap:wrap}
.bns>div{flex:1;min-width:160px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface2)}
.file>div{flex:1;min-width:0;overflow-wrap:anywhere}
.docket{border:2px solid var(--navy);border-left:14px solid var(--saffron);border-radius:12px;padding:14px 18px;background:var(--surface)}
:root[data-theme="dark"] .docket{border-color:var(--teal)}
.docket .id{font-size:clamp(1.4rem,6vw,2.3rem);font-weight:800;letter-spacing:.05em;overflow-wrap:anywhere}
.check-pop{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:bounce .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes bounce{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
/* rail */
.rail{display:grid;grid-template-columns:repeat(5,1fr);margin:22px 0;padding:0;list-style:none}
.rail li{position:relative;text-align:center;font-size:.85rem;padding-top:34px;color:var(--muted)}
.rail li::before{content:"";position:absolute;top:8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--line);z-index:1;transition:all .4s}
.rail li::after{content:"";position:absolute;top:15px;left:-50%;width:100%;height:4px;background:var(--line)}
.rail li:first-child::after{display:none}
.rail li.done,.rail li.cur{color:var(--ink)}
.rail li.done::before,.rail li.cur::before{background:var(--teal);border-color:var(--teal)}
.rail li.done::after,.rail li.cur::after{background:var(--teal)}
.rail li.cur{font-weight:700}
.rail li.cur::before{box-shadow:0 0 0 6px var(--saffron-soft),0 0 0 8px var(--saffron)}
@media (max-width:640px){
  .rail{grid-template-columns:1fr}
  .rail li{text-align:left;padding:0 0 20px 38px}
  .rail li::before{left:0;top:2px;margin-left:0}
  .rail li::after{left:8px;top:-18px;width:4px;height:100%}
}
/* tables */
.tablewrap{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{background:var(--teal-soft);font-weight:700}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .15s}
tr.click:hover td{background:var(--teal-soft)}
tr.sel td{background:var(--saffron-soft)}
@media (max-width:720px){
  .tablewrap{overflow:visible;border:0;background:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 0;box-shadow:var(--shadow)}
  table.rt td{display:flex;justify-content:space-between;gap:14px;border:0;padding:5px 14px;text-align:right}
  table.rt td::before{content:attr(data-l);font-weight:700;color:var(--muted);text-align:left;flex:none}
}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--surface);color:inherit;border-radius:99px;padding:6px 16px;font:inherit;cursor:pointer;min-height:42px;transition:all .15s}
.tabs button:hover{border-color:var(--teal)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}

.bar i{display:block;height:14px;border-radius:6px;background:linear-gradient(90deg,var(--teal),#2A6FDB);transform-origin:left;animation:grow .8s ease-out}

.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut circle.seg{fill:none;stroke-width:16;animation:dash 1s ease-out}

.legend{display:grid;gap:4px;font-size:.88rem}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.loginside h2{color:#fff}
.loginform{padding:32px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}

async function initData(){

    db.collection("complaints").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); cache.complaints = o; dataChanged(); }, err);
    db.collection("accounts").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()); cache.accounts = o; dataChanged(); }, err);

/* ===================== routing with guards ===================== */
function route(){ const p = (location.hash || "#/").replace(/^#/, "").split("/").filter(Boolean); return {name:p[0] || "home"}; }
function go(path){ if (location.hash === "#" + path) { render(true); } else location.hash = path; }
function guard(){
  const n = route().name;
  if (n === "admin" && !isRole("admin")) { if (session) { session = null; store.sdel("pcp_session"); } location.replace("#/admin-login"); return false; }
  if (n === "police" && !isRole("police")) { if (session && session.role !== "police") {} location.replace("#/police-login"); return false; }
  if (n === "admin-login" && isRole("admin")) { location.replace("#/admin"); return false; }
  if (n === "police-login" && isRole("police")) { location.replace("#/police"); return false; }
  return true;
}

let io = null;
function observeReveal(){
  const els = document.querySelectorAll(".reveal:not(.in)");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
  els.forEach(e => io.observe(e));
}

function stepSummary(i){
  const area = find(AREAS, wiz.area);
  if (i === 0) return wiz.done[0] ? reg.name + " · " + reg.mobile : "";
  if (i === 1) return nm(find(CATS, wiz.category));
  if (i === 2) return wiz.done[2] ? nm(area) + (wiz.text ? " · " + wiz.text.slice(0, 40) : "") : "";
  if (i === 3) return wiz.done[3] ? wiz.title : "";
  if (i === 4) return wiz.done[4] ? (wiz.evidence.length ? wiz.evidence.length + " " + t("rEv").toLowerCase() : t("rNone")) : "";
  if (i === 5) return wiz.done[5] ? t("stDone") : "";

function rail(status){

function sendCode(){
  const id = trk.id.trim().toUpperCase(); trk.err = "";
  if (!id) { trk.err = t("vId"); renderView(); return; }
  trk.id = id; const c = cache.complaints[id];
  if (c) { const code = rand6(); trk.otp = {id, code, exp:Date.now() + DEMO_CONFIG.otpMinutes * 60000, tries:0}; trk.sms = {mobile:c.citizen.mobile, code}; audit("Verification code requested", id, ""); }
  else { trk.otp = null; trk.sms = null; }
  trk.stage = "code"; trk.code = ""; renderView();
}
function verifyCode(){
  const o = trk.otp, code = trk.code.trim(); trk.err = "";
  if (!o) trk.err = t("otpBad",{n:DEMO_CONFIG.otpMaxTries - 1});
  else if (Date.now() > o.exp) trk.err = t("otpExpired");
  else if (o.tries >= DEMO_CONFIG.otpMaxTries) trk.err = t("otpLocked");
  else if (code !== o.code) { o.tries++; trk.err = o.tries >= DEMO_CONFIG.otpMaxTries ? t("otpLocked") : t("otpBad",{n:DEMO_CONFIG.otpMaxTries - o.tries}); }
  else { trk.stage = "verified"; trk.verifiedId = o.id; trk.otp = null; trk.sms = null; trk.code = ""; audit("Citizen verified for tracking", o.id, ""); toast(t("verifiedMsg"), "ok"); }
  renderView();
}
async function verifyMobile(){
  trk.err = ""; const id = (trk.id || "").trim().toUpperCase(), c = cache.complaints[id], mob = (trk.mob || "").trim();
  trk.lock = trk.lock || {}; const L = trk.lock[id] || (trk.lock[id] = {n:0, until:0});
  if (Date.now() < L.until) { trk.err = t("mobBad"); renderView(); return; }
  let ok = false;
  if (c && /^\d{10}$/.test(mob)) { const hh = await sha("pcp-demo-mob:" + id + ":" + mob); ok = hh === (c.mobHash || await sha("pcp-demo-mob:" + id + ":" + c.citizen.mobile)); }
  if (ok) { trk.id = id; trk.stage = "verified"; trk.verifiedId = id; trk.mob = ""; L.n = 0; audit("Citizen verified for tracking (mobile, demo)", id, ""); toast(t("verifiedMsg"), "ok"); }
  else { L.n++; if (L.n >= DEMO_CONFIG.otpMaxTries) { L.until = Date.now() + DEMO_CONFIG.lockSeconds * 1000; L.n = 0; } trk.err = t("mobBad"); }
  renderView();
}

  const isA = role === "admin", open = !isA || ui.opened[c.id];
  const head = `<div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:1.2rem;overflow-wrap:anywhere">${esc(c.id)}</h2>${statusTag(c.status)}</div>
    <div class="muted small">${esc(nm(find(CATS,c.category)))} · ${esc(nm(find(AREAS,c.area)))} · ${esc(sName(c.routedStation))}</div>`;
  if (!open) return `<div class="card stack" id="detail">${head}<div class="note">${esc(t("restricted"))}</div><button class="btn" data-act="opendetail" data-v="${esc(c.id)}">${ic("eye",18)} ${esc(t("openLogged"))}</button></div>`;
  const officers = Object.values(cache.accounts).filter(a => a.role === "police" && a.station === c.routedStation && a.active !== false), rv = ui.revealed[c.id];
  return `<div class="card stack" id="detail">${head}
    <div><b>${esc(t("complainant"))}</b><br>${rv ? `${esc(c.citizen.name)}<br>${esc(c.citizen.mobile)} · ${esc(c.citizen.email)}<br>${esc(c.citizen.address)}<br><span class="muted small">${esc(c.citizen.lang==="te"?"తెలుగు":"English")} · ${esc(sName(c.citizen.station))}</span>` : `<span class="muted">${esc(t("contactHidden"))}</span> <button class="btn sm sec" data-act="reveal" data-v="${esc(c.id)}">${esc(t("showContact"))}</button>`}</div>
    <div><b>${esc(c.petition.title)}</b><div class="petition small" lang="${esc(c.petition.lang)}">${esc(c.petition.body)}</div></div>
    <div><b>${esc(t("origDesc"))}</b><div class="petition small" lang="${esc(c.descLang==="te"?"te":"")}">${esc(c.incidentText)}</div></div>
    <div><b>${esc(t("sugBns"))}</b> <span class="muted small">(${esc(t("sugNote"))})</span>
      ${(c.bns||[]).length ? c.bns.map((b,i) => `<div class="bns"><b>${esc(b.section)}</b><div><div>${esc(b.title)} <span class="tag ${b.status==="verified"?"ok":b.status==="rejected"?"no":""}">${esc(t(b.status==="verified"?"stVerified":b.status==="rejected"?"stRejected":"stSuggested"))}</span></div><div class="muted small">${esc(b.reason)}</div></div><div class="row"><button class="btn sm sec" data-act="bns" data-id="${esc(c.id)}" data-i="${i}" data-v="verified">${esc(t("verifyB"))}</button><button class="btn sm sec" data-act="bns" data-id="${esc(c.id)}" data-i="${i}" data-v="rejected">${esc(t("rejectB"))}</button></div></div>`).join("") : `<div class="muted small">${esc(t("bnsNone"))}</div>`}</div>
    <div><b>${esc(t("evidenceH"))}</b>${(c.evidence||[]).length ? c.evidence.map((f,i) => `<div class="file">${ic("file",20)}<div>${esc(f.name)}<div class="muted small">${Math.max(1,Math.round((f.size||0)/1024))} KB${f.sha ? " · " + esc(t("evFp")) + ": " + esc(f.sha.slice(0,12)) : ""}</div></div><button class="btn sm sec" data-act="evview" data-id="${esc(c.id)}" data-i="${i}">${esc(t("evView"))}</button></div>`).join("") : `<div class="muted small">${esc(t("evNone"))}</div>`}</div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <label class="field"><span class="l">${esc(t("assignTo"))}</span><select data-act-change="assign" data-id="${esc(c.id)}"><option value="">${esc(t("unassigned"))}</option>${officers.map(o => `<option value="${esc(o.loginId)}" ${c.assignedTo===o.loginId?"selected":""}>${esc(o.name)} · ${esc(o.designation)}</option>`).join("")}</select></label>
    <label class="field"><span class="l">${esc(t("updStatus"))}</span><select id="stSel">${STATUSES.filter(s=>s.id!=="closed").map(s => `<option value="${s.id}" ${c.status===s.id?"selected":""}>${esc(nm(s))}</option>`).join("")}</select></label>
    <label class="field"><span class="l">${esc(t("noteL"))}</span><textarea id="stNote" style="min-height:90px"></textarea></label>
    <div><button class="btn" data-act="setstatus" data-id="${esc(c.id)}">${esc(t("saveUpd"))}</button></div>
    ${c.status !== "closed" ? `<hr style="border:0;border-top:1px solid var(--line);width:100%"><b>${esc(t("closeH"))}</b>
      <label class="field"><span class="l">${esc(t("outcome"))}</span><select id="clOut">${OUTCOMES.map(o => `<option value="${esc(o.id)}">${esc(nm(o))}</option>`).join("")}</select></label>
      <label class="field"><span class="l">${esc(t("remarks"))}</span><textarea id="clRem" style="min-height:80px"></textarea></label>
      <div><button class="btn danger" data-act="close" data-id="${esc(c.id)}">${esc(t("closeB"))}</button></div>` : `<div class="okbox"><b>${esc(t("closedLbl"))}:</b> ${esc(c.closure ? c.closure.outcome + " — " + c.closure.remarks : "")}</div>`}
    <div><b>${esc(t("notesH"))}</b>${(c.notes||[]).length ? c.notes.slice().reverse().map(n => `<div class="small" style="margin-top:6px"><span class="muted">${esc(fmt(n.ts))} · ${esc(n.by)}</span><br>${esc(n.text)}</div>`).join("") : `<div class="muted small">${esc(t("noNotes"))}</div>`}</div>
    <div><b>${esc(t("histH"))}</b>${(c.history||[]).slice().reverse().map(h => `<div class="small" style="margin-top:4px"><span class="muted">${esc(fmt(h.ts))}</span> · ${esc(nm(find(STATUSES,h.status)))} · ${esc(h.by)}${h.note?" · "+esc(h.note):""}</div>`).join("")}</div>
    <div><b>${esc(t("msgsH"))}</b>${(c.notifications||[]).slice().reverse().slice(0,6).map(n => `<div class="small" style="margin-top:4px"><span class="tag teal">${esc(n.channel==="email"?t("chEmail"):t("chSms"))}</span> <span class="muted">${esc(fmt(n.ts))}</span><br><span lang="${esc(n.lang)}">${esc(n.text)}</span></div>`).join("") || `<div class="muted small">${esc(t("tNoMsgs"))}</div>`}</div>
  </div>`;
}
async function staffAction(act, el){
  const id = el.dataset.id, base = cache.complaints[id];
  if (!base || !canTouch(base)) { toast(t("tDenied"), "bad"); return; }
  const c = JSON.parse(JSON.stringify(base));
  if (act === "bns") { c.bns[+el.dataset.i].status = el.dataset.v; c.bns[+el.dataset.i].by = session.loginId; audit("BNS suggestion " + el.dataset.v, id, c.bns[+el.dataset.i].section); }
  if (act === "assign" || act === "adminassign") {
    if (act === "adminassign" && !isRole("admin")) { toast(t("tDenied"), "bad"); return; }
    const v = el.value; if (v) { const o = cache.accounts[v]; if (!o || o.role !== "police" || o.station !== c.routedStation) { toast(t("tDenied"), "bad"); return; } }
    c.assignedTo = v || null; audit(v ? "Assigned complaint" : "Unassigned complaint", id, v);
    if (v && ["submitted","review"].includes(c.status)) changeStatus(c, "assigned", "Assigned to " + (cache.accounts[v] ? cache.accounts[v].name : v));
  }
  if (act === "setstatus") {
    const st = $("#stSel").value, note = $("#stNote").value.trim();
    if (note) c.notes = (c.notes || []).concat([{ts:Date.now(), by:session.name, text:note}]);
    if (st !== c.status) { changeStatus(c, st, note); audit("Status changed to " + (find(STATUSES, st) || {en:st}).en, id, note); }
    else if (note) audit("Added note", id, "");
    else { toast(t("tNothing")); return; }
  }
  if (act === "close") {
    const rem = $("#clRem").value.trim(); if (!rem) { toast(t("tRemarks"), "bad"); return; }
    c.closure = {outcome:$("#clOut").value, remarks:rem, by:session.name, ts:Date.now()}; changeStatus(c, "closed", c.closure.outcome); audit("Closed complaint", id, c.closure.outcome);
  }
  await saveComplaint(c); renderView(); toast(act === "adminassign" || act === "assign" ? t("tAssignOk") : t("tSaved"), "ok");
}
async function adminAccountAction(act, el){
  if (!isRole("admin")) { toast(t("tDenied"), "bad"); return; }
  if (act === "addacct") {
    const n = newAcct, id = n.loginId.trim().toLowerCase();
    if (!/^[a-z0-9-]{3,30}$/.test(id) || !n.name.trim() || !n.station || !/^\d{4}$/.test(n.pin)) { toast(t("tFillAll"), "bad"); return; }
    if (cache.accounts[id]) { toast(t("tExists"), "bad"); return; }
    await saveAccount({loginId:id, role:"police", name:n.name.trim(), designation:n.designation.trim() || "Officer", station:n.station, active:true, hash:await hashPin(n.pin)});
    audit("Created police account", id, sName(n.station)); Object.assign(newAcct, {loginId:"", name:"", designation:"", station:"", pin:""}); renderView(); toast(t("tAcctOk"), "ok");
  }
  if (act === "toggleacct") { const a = {...cache.accounts[el.dataset.id]}; a.active = a.active === false; await saveAccount(a); audit(a.active ? "Enabled account" : "Disabled account", a.loginId, ""); renderView(); toast(t("tSaved"), "ok"); }
  if (act === "resetpin") { const v = $("#pin-" + CSS.escape(el.dataset.id)).value; if (!/^\d{4}$/.test(v)) { toast(t("tEnter4"), "bad"); return; } const a = {...cache.accounts[el.dataset.id], hash:await hashPin(v)}; await saveAccount(a); audit("Reset PIN", a.loginId, ""); renderView(); toast(t("tPinOk"), "ok"); }
}

/* ===================== events ===================== */
document.addEventListener("click", async ev => {
  if (!ev.target.closest(".menu") && ui.menu) { ui.menu = false; const p = $(".pop"); if (p) p.classList.remove("open"); }
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === "menu") { ui.menu = !ui.menu; $(".pop").classList.toggle("open", ui.menu); el.setAttribute("aria-expanded", ui.menu); return; }
  if (act === "nav") { ui.menu = false; const to = el.dataset.to; if (to === "/track" && trk.stage === "verified") resetTrack(); go(to); return; }
  if (act === "scroll") { const h = document.getElementById(el.dataset.to); if (h) h.scrollIntoView({behavior:"smooth"}); return; }
  if (act === "lang") { setLang(el.dataset.v); return; }
  if (act === "openstep") { const i = +el.dataset.i; wiz.open = wiz.open === i ? -1 : i; wiz.err = ""; wiz.errs = {}; renderView(); if (wiz.open === i) scrollToPanel(); return; }
  if (act === "editstep") { wiz.open = +el.dataset.i; wiz.err = ""; renderView(); scrollToPanel(); return; }
  if (act === "nextstep") { nextStep(); return; }
  if (act === "prevstep") { wiz.open = Math.max(0, wiz.open - 1); wiz.err = ""; wiz.errs = {}; renderView(); scrollToPanel(); return; }
  if (act === "cat") { wiz.category = el.dataset.v; wiz.errs = {}; if (wiz.body) wiz.stale = true; saveDraft(); renderView(); return; }
  if (act === "gen") { if (validateStep(2) && Object.keys(validateStep(2)).length) { wiz.open = 2; wiz.errs = validateStep(2); wiz.err = t("errFix"); renderView(); return; } genPetition(); return; }
  if (act === "evdel") { wiz.evidence.splice(+el.dataset.i, 1); saveDraft(); renderView(); return; }
  if (act === "submit") { submitComplaint(); return; }
  if (act === "discard") { store.del("pcp_draft"); const keepL = lang; wiz = blankWiz(); Object.assign(reg, {name:"", mobile:"", email:"", address:"", district:"", station:"", prefLang:keepL}); draftLoaded = true; toast(t("discarded")); renderView(); return; }
  if (act === "newcomplaint") { wiz = blankWiz(); draftLoaded = false; go("/"); return; }
  if (act === "trackid") { resetTrack(); trk.id = el.dataset.v; go("/track"); return; }
  if (act === "sendcode") { sendCode(); return; }
  if (act === "back") { const rn = route().name; if (rn === "file" && !wiz.submitted && wiz.open > 0) { wiz.open--; wiz.err = ""; wiz.errs = {}; renderView(); scrollToPanel(); } else if (rn === "track" && trk.stage === "code") { trk.stage = "id"; trk.err = ""; renderView(); } else go("/"); return; }
  if (act === "tpet") { translatePetition(); return; }
  if (act === "mobverify") { verifyMobile(); return; }
  if (act === "verify") { verifyCode(); return; }
  if (act === "login") { doLogin(el.dataset.role); return; }
  if (act === "signout") { signOut(); return; }
  if (act === "tab") { if (!session) return; ui.tab = el.dataset.v; renderView(); return; }
  if (act === "sel") { const c = cache.complaints[el.dataset.v]; if (!c || !canTouch(c)) { toast(t("tDenied"), "bad"); return; } ui.sel = el.dataset.v; if (isRole("police") && !ui.opened[c.id]) { ui.opened[c.id] = true; audit("Opened complaint details", c.id, ""); } renderView(); const d = $("#detail"); if (d && innerWidth < 960) d.scrollIntoView({behavior:"smooth"}); return; }
  if (act === "opendetail") { const c = cache.complaints[el.dataset.v]; if (!isRole("admin") || !c) { toast(t("tDenied"), "bad"); return; } ui.opened[c.id] = true; audit("Opened complaint details", c.id, ""); renderView(); return; }
  if (act === "reveal") { const c = cache.complaints[el.dataset.v]; if (!c || !canTouch(c)) { toast(t("tDenied"), "bad"); return; } ui.revealed[c.id] = true; audit("Viewed complainant contact", c.id, ""); renderView(); return; }
  if (act === "evview") { const c = cache.complaints[el.dataset.id]; if (!c || !canTouch(c)) { toast(t("tDenied"), "bad"); return; } audit("Accessed evidence", c.id, (c.evidence[+el.dataset.i] || {}).name || ""); toast(t("evViewed"), "ok"); return; }
  if (["bns","setstatus","close"].includes(act)) { staffAction(act, el); return; }
  if (["addacct","toggleacct","resetpin"].includes(act)) { adminAccountAction(act, el); return; }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && ui.menu) { ui.menu = false; const p = $(".pop"); if (p) p.classList.remove("open"); }
  if (ev.key === "Enter" && ev.target.matches("tr.click")) ev.target.click();
  if (ev.key === "Enter" && ev.target.matches('[data-k="login.pin"]')) doLogin(route().name.startsWith("admin") ? "admin" : "police");
  if (ev.key === "Enter" && ev.target.matches('[data-k="trk.id"]')) sendCode();
  if (ev.key === "Enter" && ev.target.matches('[data-k="trk.code"]')) verifyCode();
});
function setKey(path, val){ const p = path.split("."); let o = roots[p[0]]; for (let i = 1; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length-1]] = val; }
document.addEventListener("input", ev => {
  const el = ev.target, k = el.dataset && el.dataset.k; if (!k || el.type === "checkbox" || el.tagName === "SELECT") return;
  setKey(k, el.value);
  const f = k.split(".").pop(); const m = $("#err-" + f); if (m && wiz.errs[f]) { delete wiz.errs[f]; m.remove(); el.removeAttribute("aria-invalid"); }
  if (k === "wiz.text" && wiz.body) wiz.stale = true;
  if (k.startsWith("reg.") || k.startsWith("wiz.")) saveDraft();
  if (k === "ui.q") { clearTimeout(input_t); input_t = setTimeout(() => { const pos = el.selectionStart; renderView(); const n = $('[data-k="ui.q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } }, 250); }
});
let input_t;
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.langsel !== undefined) { setLang(el.value); return; }
  if (el.id === "evfile") { addFiles(el.files); el.value = ""; return; }
  if (el.dataset.k) {
    setKey(el.dataset.k, el.type === "checkbox" ? el.checked : el.value);
    if (el.dataset.k.startsWith("reg.") || el.dataset.k.startsWith("wiz.")) { if (el.dataset.k === "wiz.area" && wiz.body) wiz.stale = true; saveDraft(); }
    if (el.dataset.rerender) { if (el.dataset.k === "reg.district") reg.station = ""; if (el.dataset.k === "ui.flt.district") ui.flt.station = ""; renderView(); }
    else if (el.dataset.k === "wiz.agreed") { delete wiz.errs.agreed; renderView(); }
  }
  if (el.dataset.actChange) staffAction(el.dataset.actChange, el);
});

render(true);
initData();
</script>
